title: "QUANTEC Radiation"
description: "Evidence-based radiation toxicity risk metrics for radiation oncology"
url: "https://quantecradiation.org"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

# Jekyll settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Site settings
author:
  name: "QUANTEC Radiation Team"
  email: "BrianAnderson@ucsd.edu"

# Social links (optional)
social:
  email: BrianAnderson@ucsd.edu
  
# SEO settings
seo:
  name: "QUANTEC Radiation"
  type: Organization

# Exclude files from processing.
# Anything not listed here IS published to quantecradiation.org — Jekyll copies unknown files
# through verbatim. Check `_site/` after adding any non-page file to the repo.
exclude:
  - README.md
  - CREDITS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - docs
  - "*.docx"

# Default settings
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
